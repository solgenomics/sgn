on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

env:
  # A folder can run in parts: each part runs the folder's test files whose
  # path sorts (LC_ALL=C) from one split point to the next, so every file,
  # a new one too, runs in exactly one part. The split points keep the
  # parts at about the same time (see the times printed by prove --timer).
  UNIT_FIXTURE_SPLIT: t/unit_fixture/CXGN/Uploading/VCFGenotypes.t
  BREEDERS_SPLIT_1: t/selenium2/breeders/create_phenotyping_spreadsheet.t
  BREEDERS_SPLIT_2: t/selenium2/breeders/upload_phenotype/upload_datacollector_spreadsheet.t

jobs:
  # The tests run in parallel parts. Every part starts the same containers
  # and loads the fixture; every /entrypoint.sh call then runs its tests on
  # a fresh copy of the fixture database, as the former single job did.
  test_part:
    name: test_breedbase (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: unit_fixture_1
            tests: |
              run_files t/unit_fixture "" "$UNIT_FIXTURE_SPLIT"
          - part: unit_fixture_2
            tests: |
              run_files t/unit_fixture "$UNIT_FIXTURE_SPLIT" ""
          - part: unit_mech
            tests: |
              /entrypoint.sh --nopatch t/unit_mech
          # selenium tests for a moment as separate folders - will change once full solgs are ready
          # but anyway, it will is still fully functional for tests purpose
          - part: selenium_breeders_1
            tests: |
              run_files t/selenium2/breeders "" "$BREEDERS_SPLIT_1"
          - part: selenium_breeders_2
            tests: |
              run_files t/selenium2/breeders "$BREEDERS_SPLIT_1" "$BREEDERS_SPLIT_2"
          - part: selenium_breeders_3
            tests: |
              run_files t/selenium2/breeders "$BREEDERS_SPLIT_2" ""
          - part: selenium_1
            tests: |
              /entrypoint.sh --nopatch t/selenium2/01_list 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/02_trial 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/03_dataset 2>/dev/null
          - part: selenium_2
            tests: |
              /entrypoint.sh --nopatch t/selenium2/authenticate 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/onto 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/search 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/stock 2>/dev/null
              /entrypoint.sh --nopatch t/selenium2/tools 2>/dev/null

    container:
      image: breedbase/breedbase:latest
      env:
        HOME: /root
        MODE: 'TESTING'
        SYSTEM: 'GITACTION'
        PGPASSWORD: postgres
        PGUSER: postgres
        SGN_TEST_SERVER: http://test_breedbase:3010
        SGN_REMOTE_SERVER_ADDR: selenium
      volumes:
        - ${{ github.workspace }}:/home/production/cxgn/sgn
        - ${{ github.workspace }}:/home/vagrant/cxgn/sgn
        - /tmp/downloads:/downloads
      options: --network-alias test_breedbase --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --privileged

    services:
      breedbase_db:
        image: postgres:12.9
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      selenium:
        image: selenium/standalone-firefox:3.141.59
        volumes:
          - ${{ github.workspace }}:/home/production/cxgn/sgn
          - ${{ github.workspace }}:/home/vagrant/cxgn/sgn
          - /tmp/downloads:/downloads

        options: >-
          --health-cmd "curl --silent --head http://localhost:4444 || exit 1"
          --health-interval 5s

      keycloak_db:
        image: postgres:13.0
        env:
          POSTGRES_DB: keycloak
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      keycloak:
        image: bffafirms/keycloak:26.5.1-0-breedbase-testing
        env:
          KC_DB_USERNAME:              postgres
          KC_DB_PASSWORD:              postgres
          KC_BOOTSTRAP_ADMIN_PASSWORD: password

    steps:
      - name: Checkout sgn
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS deps
        working-directory: js
        run: npm install

      - name: Pin Node binaries
        run: |
          NODE_BIN="$(dirname "$(which node)")"
          for tool in node npm npx; do
            ln -sf "$NODE_BIN/$tool" /usr/local/bin/$tool
            ln -sf "$NODE_BIN/$tool" /usr/bin/$tool
          done
          node --version
          npm --version

      - name: Run unit tests
        if: matrix.part == 'unit_mech'
        run: prove --recurse t/unit 2>/dev/null

      - name: Load/dump fixture database
        # --noserver: each /entrypoint.sh call below starts its own server,
        # which builds the JS (lib/SGN.pm)
        run: |
          echo "--version" > ~/.proverc
          perl t/test_fixture.pl --dumpupdatedfixture --noserver
          rm ~/.proverc
        # work around run_all_patches.pl "what the heck - no TTY??" error
        # https://github.com/actions/runner/issues/241#issuecomment-842566950
        shell: 'script --flush --quiet --return --command "bash --noprofile --norc -eo pipefail {0}"'

      - name: Print the run time of each test file
        run: echo "--timer" > ~/.proverc

      - name: Run tests
        # need entrypoint.sh to start slurm
        # --nopatch to skip running fixture and db patches (already done in previous step)
        run: |
          # run_files FOLDER FROM TO: run the test files of FOLDER whose path
          # sorts from FROM (included) to TO (excluded); "" = no limit
          run_files() {
            files=$(find "$1" -name '*.t' | LC_ALL=C sort |
              LC_ALL=C awk -v from="$2" -v to="$3" '(from == "" || $0 >= from) && (to == "" || $0 < to)')
            if [ -z "$files" ]; then
              echo "::error::no test files in $1 from '$2' to '$3'"
              return 1
            fi
            set --
            for file in $files; do
              set -- "$@" "$file"
            done
            /entrypoint.sh --nopatch "$@" 2>/dev/null
          }
          ${{ matrix.tests }}

  test_breedbase:
    # one check under the former job name: it passes only when all parts pass
    needs: test_part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the result of all test parts
        env:
          RESULT: ${{ needs.test_part.result }}
        run: |
          echo "Test parts: $RESULT"
          test "$RESULT" = success
